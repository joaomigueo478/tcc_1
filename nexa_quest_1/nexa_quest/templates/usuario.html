
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta | NexaQuest</title>

    <style>
        :root {
            --creme: #F0EEE4;
            --verde: #98D611;
            --roxo-escuro: #551887;
            --roxo: #721ABF;
            --violeta: #8A2BE2;
            --texto: #342044;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--creme);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        a, button {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* ===== ESTRUTURA ===== */

        .pagina-usuario {
            width: 100%;
            max-width: 1600px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px clamp(24px, 5vw, 80px) 40px;
            display: flex;
            flex-direction: column;
        }

        .opcoes {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }
        /* ===== MENU SUPERIOR ===== */

        .cabecalho {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 24px;
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        }

        .menu {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
            padding: 5px;
            border-radius: 40px;
            background: var(--roxo-escuro);
        }

        .menu a {
            padding: 7px 13px;
            border-radius: 25px;
            color: var(--verde);
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .menu a:hover,
        .menu a.ativo {
            background: var(--verde);
            color: var(--roxo-escuro);
        }

        .perfil-pequeno {
            justify-self: end;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 3px solid var(--verde);
            border-radius: 50%;
            background: var(--roxo-escuro);
            color: var(--verde);
            font-size: 23px;
            transition: transform 0.2s;
        }

        .perfil-pequeno:hover {
            transform: scale(1.08);
        }

        /* ===== PERFIL DO USUÁRIO ===== */

        .perfil {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 45px auto 58px;
            text-align: center;
        }

        .foto-perfil {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 155px;
            height: 155px;
            margin-bottom: 27px;
            border-radius: 50%;
            background: var(--roxo-escuro);
            color: var(--verde);
            box-shadow: 5px 6px 0 rgba(52, 32, 68, 0.25);
        }

        /* Ícone de câmera desenhado em CSS */

        .camera {
            position: relative;
            width: 72px;
            height: 54px;
            border-radius: 8px;
            background: var(--verde);
        }

        .camera::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 12px;
            width: 26px;
            height: 12px;
            border-radius: 4px 4px 0 0;
            background: var(--verde);
        }

        .camera::after {
            content: "";
            position: absolute;
            top: 12px;
            left: 22px;
            width: 27px;
            height: 27px;
            border: 6px solid var(--roxo-escuro);
            border-radius: 50%;
        }

        .camera-mais {
            position: absolute;
            top: 20px;
            left: 27px;
            font-size: 43px;
            line-height: 1;
            font-weight: bold;
        }

        .nome-usuario {
            max-width: 100%;
            color: var(--roxo-escuro);
            font-size: clamp(21px, 2.5vw, 26px);
            font-weight: 900;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        /* ===== LISTAS DE CONFIGURAÇÕES ===== */

        .opcoes {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .lista {
            overflow: hidden;
            margin-bottom: 95px;
            border: 1.5px solid var(--roxo-escuro);
            border-radius: 29px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 67px;
            padding: 15px 60px;
            border-bottom: 1px solid rgba(85, 24, 135, 0.55);
            color: var(--roxo-escuro);
            font-size: clamp(15px, 2vw, 23px);
            font-weight: 900;
            text-transform: uppercase;
            transition: background 0.2s, padding 0.2s;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:hover {
            background: rgba(138, 43, 226, 0.08);
            padding-left: 67px;
        }

        .seta {
            flex-shrink: 0;
            color: var(--roxo);
            font-size: 24px;
            font-weight: normal;
        }

        /* ===== BOTÃO DE SAIR ===== */

        .area-sair {
            display: flex;
            justify-content: center;
            margin-top: -27px;
        }

        .botao-sair {
            min-width: 255px;
            padding: 13px 30px;
            border: none;
            border-radius: 35px;
            background: var(--roxo-escuro);
            color: var(--verde);
            box-shadow: 0 5px 0 rgba(52, 32, 68, 0.2);
            font-size: 23px;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .botao-sair:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .botao-sair:focus-visible,
        .item:focus-visible,
        .menu a:focus-visible,
        .perfil-pequeno:focus-visible {
            outline: 3px solid var(--violeta);
            outline-offset: 4px;
        }

        /* ===== RODAPÉ ===== */

        .rodape {
            margin-top: auto;
            padding-top: 35px;
            color: #68547B;
            font-size: 11px;
            text-align: center;
        }

        /* ===== TABLETS ===== */

        @media (max-width: 850px) {
            .pagina-usuario {
                padding: 18px 4% 30px;
            }

            .cabecalho {
                grid-template-columns: 1fr auto;
            }

            .cabecalho::before {
                content: "";
                display: none;
            }

            .menu {
                justify-self: center;
            }

            .menu a {
                padding: 7px 9px;
                font-size: 11px;
            }

            .perfil {
                margin-top: 40px;
                margin-bottom: 45px;
            }

            .foto-perfil {
                width: 135px;
                height: 135px;
            }

            .lista {
                margin-bottom: 65px;
            }

            .item {
                min-height: 60px;
                padding: 14px 30px;
            }

            .item:hover {
                padding-left: 35px;
            }
        }

        /* ===== CELULARES ===== */

        @media (max-width: 600px) {
            .pagina-usuario {
                padding: 15px 5% 25px;
            }

            .cabecalho {
                display: flex;
                flex-direction: column;
                gap: 13px;
            }

            .menu {
                order: 1;
                width: 100%;
                gap: 2px;
            }

            .menu a {
                flex: 1;
                padding: 9px 5px;
                font-size: 10px;
                text-align: center;
            }

            .perfil-pequeno {
                align-self: flex-end;
                width: 38px;
                height: 38px;
            }

            .perfil {
                margin: 30px auto 38px;
            }

            .foto-perfil {
                width: 115px;
                height: 115px;
                margin-bottom: 23px;
            }

            .camera {
                transform: scale(0.82);
            }

            .camera-mais {
                top: 14px;
                left: 18px;
                font-size: 36px;
            }

            .nome-usuario {
                font-size: 20px;
            }

            .lista {
                margin-bottom: 40px;
                border-radius: 22px;
            }

            .item {
                min-height: 55px;
                padding: 13px 18px;
                font-size: 14px;
                line-height: 1.35;
            }

            .item:hover {
                padding-left: 18px;
            }

            .seta {
                font-size: 20px;
            }

            .area-sair {
                margin-top: -8px;
            }

            .botao-sair {
                min-width: 210px;
                padding: 12px 25px;
                font-size: 19px;
            }

            .rodape {
                padding-top: 30px;
                line-height: 1.8;
            }
        }

        @media (max-width: 360px) {
            .menu a {
                padding: 8px 3px;
                font-size: 9px;
            }

            .item {
                padding: 12px;
                font-size: 12px;
            }

            .item:hover {
                padding-left: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
        .perfil {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: clamp(35px, 4vw, 55px) auto
                    clamp(40px, 5vw, 65px);
            text-align: center;
        }

        .foto-perfil {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(120px, 10vw, 155px);
            height: clamp(120px, 10vw, 155px);
            margin-bottom: 27px;
            border-radius: 50%;
            background: var(--roxo-escuro);
            color: var(--verde);
            box-shadow: 5px 6px 0 rgba(52, 32, 68, 0.25);
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: clamp(58px, 5vw, 72px);
            padding: 15px clamp(20px, 4vw, 60px);
            border-bottom: 1px solid rgba(85, 24, 135, 0.55);
            color: var(--roxo-escuro);
            font-size: clamp(15px, 1.5vw, 23px);
            font-weight: 900;
            text-transform: uppercase;
            transition: background 0.2s, padding 0.2s;
        }
    
        /* ===== NOTEBOOKS E COMPUTADORES ===== */

        @media (min-width: 1000px) {
            .pagina-usuario {
                padding-top: 28px;
            }

            .lista {
                margin-bottom: 75px;
            }
        }

        /* ===== MONITORES GRANDES ===== */

        @media (min-width: 1440px) {
            .pagina-usuario {
                padding-top: 35px;
            }

            .opcoes {
                max-width: 900px;
            }
        }

        /* ===== TELAS COM POUCA ALTURA ===== */

        @media (min-width: 851px) and (max-height: 750px) {
            .perfil {
                margin-top: 25px;
                margin-bottom: 30px;
            }

            .foto-perfil {
                width: 115px;
                height: 115px;
                margin-bottom: 18px;
            }

            .lista {
                margin-bottom: 35px;
            }

            .item {
                min-height: 52px;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .botao-sair {
                padding-top: 11px;
                padding-bottom: 11px;
            }
        }


    </style>
</head>

<body>

    <main class="pagina-usuario">

        <!-- MENU SUPERIOR -->
        <header class="cabecalho">

            <div aria-hidden="true"></div>

            <nav class="menu" aria-label="Menu principal">
                <a href="inicio.html">Início</a>
                <a href="inscricao.html">Login</a>
                <a href="produtos.html">Produtos</a>
                <a href="sobre.html">Sobre nós</a>
            </nav>

            <a
                href="usuario.html"
                class="perfil-pequeno"
                aria-label="Minha conta"
                aria-current="page"
                title="Minha conta"
            >
                ♟
            </a>

        </header>

        <!-- PERFIL -->
        <section class="perfil" aria-label="Perfil do usuário">

            <a
                href="#alterar-foto"
                class="foto-perfil"
                aria-label="Alterar foto do perfil"
                title="Alterar foto do perfil"
            >
                <span class="camera-mais" aria-hidden="true">+</span>
                <span class="camera" aria-hidden="true"></span>
            </a>

            <h1 class="nome-usuario">Nome de usuário</h1>

        </section>

        <!-- OPÇÕES DA CONTA -->
        <section class="opcoes" aria-label="Configurações da conta">

            <div class="lista">

                <a href="informacoes.html" class="item">
                    <span>Informações e permissões</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a href="privacidade.html" class="item">
                    <span>Privacidade e segurança</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a href="#gerenciamento" class="item">
                    <span>Gerenciamento de conta</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a href="#pagamento" class="item">
                    <span>Pagamento</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

            </div>

            <div class="lista">

                <a href="#ajuda" class="item">
                    <span>Ajuda e feedback</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a href="#convidar" class="item">
                    <span>Convide amigos</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a href="#nova-conta" class="item">
                    <span>Entrar em nova conta</span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

            </div>

            <!-- Por enquanto, o botão é apenas visual. -->
            <div class="area-sair">
                <button class="botao-sair" type="button">
                    DESLOGAR
                </button>
            </div>

        </section>

        <footer class="rodape">
            <p>NexaQuest — Aprenda. Jogue. Evolua.</p>
            <p>© 2026 NexaQuest. Todos os direitos reservados.</p>
        </footer>

    </main>

</body>
</html>
